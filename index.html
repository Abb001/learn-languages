<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One page a day</title>
<meta name="description" content="Graded reading, vocabulary and grammar for French and Arabic.">

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#E8EBEC">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="One page">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&family=Noto+Naskh+Arabic:wght@400..700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./app.css">
</head>
<body>

<div class="wrap">
  <header>
    <h1>One page a day</h1>
    <div class="sub" id="sub">Graded reading, vocabulary and grammar</div>
    <div class="langs">
      <button id="btn-fr" aria-pressed="true"><span class="n">Français</span><span class="m">reading · grammar · words</span></button>
      <button id="btn-ar" aria-pressed="false"><span class="n">العربية</span><span class="m">vowelled · transliterated</span></button>
    </div>
    <nav class="tabs">
      <button data-tab="read" aria-selected="true">Read</button>
      <button data-tab="words" aria-selected="false">Words</button>
      <button data-tab="grammar" aria-selected="false">Grammar</button>
    </nav>
  </header>
  <main id="main"></main>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Word"></div>
<div class="toast" id="toast"></div>

<script src="./content.js"></script>
<script src="./app.js"></script>
</body>
</html>
